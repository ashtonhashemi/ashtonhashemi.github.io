<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homologation DVP</title>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ securityLevel: 'loose', theme: 'base', flowchart: { useMaxWidth: true, htmlLabels: true } });
    const chart = document.getElementById('chart');
    try {
      const response = await fetch('market_hierarchy.mmd');
      if (!response.ok) throw new Error(`Chart request failed: ${response.status}`);
      const source = await response.text();
      const { svg, bindFunctions } = await mermaid.render('homologation-chart', source);
      chart.innerHTML = svg;
      bindFunctions?.(chart);
    } catch (error) {
      chart.textContent = 'The certification chart could not be loaded.';
      console.error(error);
    }
  </script>
  <style>
    :root { color-scheme: light; --ink: #111; --red: #d71920; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #f7f7f4; color: var(--ink); }
    body { font-family: Georgia, 'Times New Roman', serif; }
    main { width: min(1440px, calc(100% - 80px)); margin: 0 auto; padding: 12vh 0 10vh; }
    .eyebrow { margin: 0 0 24px; color: var(--red); font: 700 11px/1.2 Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(58px, 9vw, 142px); line-height: .86; letter-spacing: -.055em; }
    .chart-wrap { margin-top: 86px; padding: 38px 24px; background: #fff; border-top: 4px solid var(--red); overflow-x: auto; }
    #chart { min-width: 920px; min-height: 240px; text-align: center; }
    @media (max-width: 700px) { main { width: calc(100% - 32px); padding-top: 8vh; } .chart-wrap { margin-top: 54px; padding: 24px 12px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Vehicle certification / M1</p>
    <h1>Homologation DVP</h1>
    <section class="chart-wrap" aria-label="Homologation certification hierarchy">
      <div id="chart">Loading certification chart...</div>
    </section>
  </main>
</body>
</html>
