<text class="title" x="1171.0" y="75.2" text-anchor="middle">
<tspan x="1171.0" dy="0">Verification Strategy</tspan>
</text>
<rect x="36" y="100" width="130" height="48" fill="#17324d" stroke="#ffffff"/>
<text class="head" x="48" y="129.25">Test ID</text>
<rect x="166" y="100" width="260" height="48" fill="#17324d" stroke="#ffffff"/>
<text class="head" x="178" y="129.25">Required Verification</text>
<rect x="426" y="100" width="280" height="48" fill="#17324d" stroke="#ffffff"/>
<text class="head" x="438" y="129.25">Automation</text>
<rect x="706" y="100" width="440" height="48" fill="#17324d" stroke="#ffffff"/>
<text class="head" x="718" y="129.25">Test Tools / Automation Framework</text>
<rect x="1146" y="100" width="200" height="48" fill="#17324d" stroke="#ffffff"/>
<text class="head" x="1158" y="129.25">Vehicle Scope</text>
<rect x="1346" y="100" width="320" height="48" fill="#17324d" stroke="#ffffff"/>
<text class="head" x="1358" y="129.25">SiL Scope</text>
<rect x="1666" y="100" width="320" height="48" fill="#17324d" stroke="#ffffff"/>
<text class="head" x="1678" y="129.25">HiL Scope</text>
<rect x="1986" y="100" width="320" height="48" fill="#17324d" stroke="#ffffff"/>
<text class="head" x="1998" y="129.25">Automation Risk</text>
<rect x="36" y="148" width="130" height="213" fill="#f7f9fb" stroke="#aeb7bf"/>
<a href="r141_tables_viewer.html#2" target="_top">
<text class="cell test-link" x="48" y="259.0">
<tspan x="48" dy="0">TPMS-T03</tspan>
</text>
</a>
<rect x="166" y="148" width="260" height="213" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="178" y="259.0">
<tspan x="178" dy="0">Puncture (Vehicle Level)</tspan>
</text>
<rect x="426" y="148" width="280" height="213" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="438" y="217.0">
<tspan x="438" dy="0">AVehicle-level testing is</tspan>
<tspan x="438" dy="21">recommended; however,</tspan>
<tspan x="438" dy="21">automated HIL system-</tspan>
<tspan x="438" dy="21">functional testing can support</tspan>
<tspan x="438" dy="21">change-impact assessment.</tspan>
</text>
<rect x="706" y="148" width="440" height="213" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="718" y="248.5">
<tspan x="718" dy="0">Python + CANoe/CANalyzer + dSPACE + RF signal</tspan>
<tspan x="718" dy="21">generator/transceiver control.</tspan>
</text>
<rect x="1146" y="148" width="200" height="213" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="1158" y="175.0">
<tspan x="1158" dy="0">Record</tspan>
<tspan x="1158" dy="21">representative TPMS</tspan>
<tspan x="1158" dy="21">RF messages, vehicle</tspan>
<tspan x="1158" dy="21">speed, and relevant</tspan>
<tspan x="1158" dy="21">vehicle-</tspan>
<tspan x="1158" dy="21">state/network</tspan>
<tspan x="1158" dy="21">signals for</tspan>
<tspan x="1158" dy="21">synchronized bench</tspan>
<tspan x="1158" dy="21">playback.</tspan>
</text>
<rect x="1346" y="148" width="320" height="213" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="1358" y="238.0">
<tspan x="1358" dy="0">Generate TPMS sensor messages and</tspan>
<tspan x="1358" dy="21">pressure-loss profiles used to</tspan>
<tspan x="1358" dy="21">drive the bench RF transmitter.</tspan>
</text>
<rect x="1666" y="148" width="320" height="213" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="1678" y="248.5">
<tspan x="1678" dy="0">Execute ZCU → HPC → IPU and verify</tspan>
<tspan x="1678" dy="21">warning behavior/timing</tspan>
</text>
<rect x="1986" y="148" width="320" height="213" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="1998" y="206.5">
<tspan x="1998" dy="0">HIL may not reproduce actual tire</tspan>
<tspan x="1998" dy="21">deflation dynamics, RF propagation,</tspan>
<tspan x="1998" dy="21">TPMS sensor wake-up behavior,</tspan>
<tspan x="1998" dy="21">pressure sampling/transmission</tspan>
<tspan x="1998" dy="21">timing, or vehicle dynamic and</tspan>
<tspan x="1998" dy="21">thermal effects.</tspan>
</text>
<rect x="36" y="361" width="130" height="213" fill="#ffffff" stroke="#aeb7bf"/>
<a href="r141_tables_viewer.html#2" target="_top">
<text class="cell test-link" x="48" y="472.0">
<tspan x="48" dy="0">TPMS-T05</tspan>
</text>
</a>
<rect x="166" y="361" width="260" height="213" fill="#ffffff" stroke="#aeb7bf"/>
<text class="cell" x="178" y="472.0">
<tspan x="178" dy="0">Diffusion (Vehicle Level)</tspan>
</text>
<rect x="426" y="361" width="280" height="213" fill="#ffffff" stroke="#aeb7bf"/>
<text class="cell" x="438" y="430.0">
<tspan x="438" dy="0">Vehicle-level testing is</tspan>
<tspan x="438" dy="21">recommended; however,</tspan>
<tspan x="438" dy="21">automated HIL system-</tspan>
<tspan x="438" dy="21">functional testing can support</tspan>
<tspan x="438" dy="21">change-impact assessment.</tspan>
</text>
<rect x="706" y="361" width="440" height="213" fill="#ffffff" stroke="#aeb7bf"/>
<text class="cell" x="718" y="461.5">
<tspan x="718" dy="0">Python + CANoe/CANalyzer + dSPACE + RF signal</tspan>
<tspan x="718" dy="21">generator/transceiver control.</tspan>
</text>
<rect x="1146" y="361" width="200" height="213" fill="#ffffff" stroke="#aeb7bf"/>
<text class="cell" x="1158" y="388.0">
<tspan x="1158" dy="0">Record</tspan>
<tspan x="1158" dy="21">representative TPMS</tspan>
<tspan x="1158" dy="21">RF messages, vehicle</tspan>
<tspan x="1158" dy="21">speed, and relevant</tspan>
<tspan x="1158" dy="21">vehicle-</tspan>
<tspan x="1158" dy="21">state/network</tspan>
<tspan x="1158" dy="21">signals for</tspan>
<tspan x="1158" dy="21">synchronized bench</tspan>
<tspan x="1158" dy="21">playback.</tspan>
</text>
<rect x="1346" y="361" width="320" height="213" fill="#ffffff" stroke="#aeb7bf"/>
<text class="cell" x="1358" y="451.0">
<tspan x="1358" dy="0">Generate TPMS sensor messages and</tspan>
<tspan x="1358" dy="21">pressure-loss profiles used to</tspan>
<tspan x="1358" dy="21">drive the bench RF transmitter.</tspan>
</text>
<rect x="1666" y="361" width="320" height="213" fill="#ffffff" stroke="#aeb7bf"/>
<text class="cell" x="1678" y="461.5">
<tspan x="1678" dy="0">Execute ZCU → HPC → IPU and verify</tspan>
<tspan x="1678" dy="21">warning behavior/timing.</tspan>
</text>
<rect x="1986" y="361" width="320" height="213" fill="#ffffff" stroke="#aeb7bf"/>
<text class="cell" x="1998" y="419.5">
<tspan x="1998" dy="0">HIL may not reproduce actual tire</tspan>
<tspan x="1998" dy="21">deflation dynamics, RF propagation,</tspan>
<tspan x="1998" dy="21">TPMS sensors wake-up behavior,</tspan>
<tspan x="1998" dy="21">pressure sampling/transmission</tspan>
<tspan x="1998" dy="21">timing, or vehicle dynamic and</tspan>
<tspan x="1998" dy="21">thermal effects.</tspan>
</text>
<rect x="36" y="574" width="130" height="192" fill="#f7f9fb" stroke="#aeb7bf"/>
<a href="r141_tables_viewer.html#2" target="_top">
<text class="cell test-link" x="48" y="674.5">
<tspan x="48" dy="0">TPMS-T07</tspan>
</text>
</a>
<rect x="166" y="574" width="260" height="192" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="178" y="674.5">
<tspan x="178" dy="0">Malfunction (Vehicle Level)</tspan>
</text>
<rect x="426" y="574" width="280" height="192" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="438" y="674.5">
<tspan x="438" dy="0">Automated SIL — Partial System</tspan>
</text>
<rect x="706" y="574" width="440" height="192" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="718" y="653.5">
<tspan x="718" dy="0">Python + pytest + QEMU/Zephyr — automated fault</tspan>
<tspan x="718" dy="21">injection, SIL execution, regression, and</tspan>
<tspan x="718" dy="21">requirement-based pass/fail checks.</tspan>
</text>
<rect x="1146" y="574" width="200" height="192" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="1158" y="674.5">
<tspan x="1158" dy="0">None</tspan>
</text>
<rect x="1346" y="574" width="320" height="192" fill="#f7f9fb" stroke="#aeb7bf"/>
<a href="r141_tables_viewer.html#5" target="_top">
<text class="cell test-link" x="1358" y="653.5">
<tspan x="1358" dy="0">Execute ZCU and HPC TPMS</tspan>
<tspan x="1358" dy="21">application software in a virtual</tspan>
<tspan x="1358" dy="21">machine separately (SIL Stack).</tspan>
</text>
</a>
<rect x="1666" y="574" width="320" height="192" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="1678" y="674.5">
<tspan x="1678" dy="0">None</tspan>
</text>
<rect x="1986" y="574" width="320" height="192" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="1998" y="601.0">
<tspan x="1998" dy="0">Does not validate production</tspan>
<tspan x="1998" dy="21">hardware, network timing, cross-ECU</tspan>
<tspan x="1998" dy="21">synchronization, startup/restart</tspan>
<tspan x="1998" dy="21">sequencing, or production</tspan>
<tspan x="1998" dy="21">middleware behavior. Fault</tspan>
<tspan x="1998" dy="21">injection represents software-</tspan>
<tspan x="1998" dy="21">visible effects rather than the</tspan>
<tspan x="1998" dy="21">complete physical failure.</tspan>
</text>
<rect x="36" y="766" width="130" height="129" fill="#ffffff" stroke="#aeb7bf"/>
<a href="r141_tables_viewer.html#2" target="_top">
<text class="cell test-link" x="48" y="835.0">
<tspan x="48" dy="0">TPMS-T09</tspan>
</text>
</a>
<rect x="166" y="766" width="260" height="129" fill="#ffffff" stroke="#aeb7bf"/>
<text class="cell" x="178" y="824.5">
<tspan x="178" dy="0">Reset protection (Vehicle</tspan>
<tspan x="178" dy="21">Level)</tspan>
</text>
<rect x="426" y="766" width="280" height="129" fill="#ffffff" stroke="#aeb7bf"/>
<text class="cell" x="438" y="835.0">
<tspan x="438" dy="0">Automated SIL — Partial System</tspan>
</text>
<rect x="706" y="766" width="440" height="129" fill="#ffffff" stroke="#aeb7bf"/>
<text class="cell" x="718" y="814.0">
<tspan x="718" dy="0">Python + pytest + QEMU/Zephyr — automate</tspan>
<tspan x="718" dy="21">reset/state sequences and verify application</tspan>
<tspan x="718" dy="21">recovery and retained-state behavior.</tspan>
</text>
<rect x="1146" y="766" width="200" height="129" fill="#ffffff" stroke="#aeb7bf"/>
<text class="cell" x="1158" y="835.0">
<tspan x="1158" dy="0">None</tspan>
</text>
<rect x="1346" y="766" width="320" height="129" fill="#ffffff" stroke="#aeb7bf"/>
<a href="r141_tables_viewer.html#5" target="_top">
<text class="cell test-link" x="1358" y="814.0">
<tspan x="1358" dy="0">Execute HPC TPMS application</tspan>
<tspan x="1358" dy="21">software in a virtual machine (SIL</tspan>
<tspan x="1358" dy="21">Stack).</tspan>
</text>
</a>
<rect x="1666" y="766" width="320" height="129" fill="#ffffff" stroke="#aeb7bf"/>
<text class="cell" x="1678" y="835.0">
<tspan x="1678" dy="0">None</tspan>
</text>
<rect x="1986" y="766" width="320" height="129" fill="#ffffff" stroke="#aeb7bf"/>
<text class="cell" x="1998" y="793.0">
<tspan x="1998" dy="0">Virtual reset may not reproduce</tspan>
<tspan x="1998" dy="21">production power-cycle behavior,</tspan>
<tspan x="1998" dy="21">retained memory, watchdog/reset-</tspan>
<tspan x="1998" dy="21">cause handling, startup timing, or</tspan>
<tspan x="1998" dy="21">peripheral initialization.</tspan>
</text>
</svg>