</text>
<rect x="906" y="406" width="320" height="192" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="918" y="485.5">
<tspan x="918" dy="0">Execute ZCU and HPC TPMS</tspan>
<tspan x="918" dy="21">application software in a virtual</tspan>
<tspan x="918" dy="21">machine separately (SIL Stack).</tspan>
</text>
<rect x="1226" y="406" width="320" height="192" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="1238" y="506.5">
<tspan x="1238" dy="0">None</tspan>
</text>
<rect x="1546" y="406" width="320" height="192" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="1558" y="433.0">
<tspan x="1558" dy="0">Does not validate production</tspan>
<tspan x="1558" dy="21">hardware, network timing, cross-ECU</tspan>
<tspan x="1558" dy="21">synchronization, startup/restart</tspan>
<tspan x="1558" dy="21">sequencing, or production</tspan>
<tspan x="1558" dy="21">middleware behavior. Fault</tspan>
<tspan x="1558" dy="21">injection represents software-</tspan>
<tspan x="1558" dy="21">visible effects rather than the</tspan>
<tspan x="1558" dy="21">complete physical failure.</tspan>
</text>
