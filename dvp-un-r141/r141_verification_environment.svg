</text>
<rect x="426" y="148" width="280" height="129" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="438" y="217.0">
<tspan x="438" dy="0">Only measurements- Canlyzer</tspan>
</text>
<rect x="706" y="148" width="200" height="129" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="718" y="175.0">
<tspan x="718" dy="0">Real tire deflation,</tspan>
<tspan x="718" dy="21">conditioning,</tspan>
<tspan x="718" dy="21">driving, and actual</tspan>
<tspan x="718" dy="21">telltale</tspan>
<tspan x="718" dy="21">confirmation.</tspan>
</text>
<rect x="906" y="148" width="320" height="129" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="918" y="185.5">
<tspan x="918" dy="0">Not applicable — requires physical</tspan>
<tspan x="918" dy="21">tire pressure loss, real TPMS</tspan>
<tspan x="918" dy="21">sensor/RF behavior, tire thermal</tspan>
<tspan x="918" dy="21">response, and vehicle dynamics.</tspan>
</text>
<rect x="1226" y="148" width="320" height="129" fill="#f7f9fb" stroke="#aeb7bf"/>
<text class="cell" x="1238" y="175.0">
<tspan x="1238" dy="0">Not selected — bench simulation</tspan>
<tspan x="1238" dy="21">cannot reproduce the required</tspan>
<tspan x="1238" dy="21">tyre/road/vehicle interaction; real</tspan>
<tspan x="1238" dy="21">hardware adds limited value versus</tspan>
<tspan x="1238" dy="21">the vehicle test.</tspan>
</text>
