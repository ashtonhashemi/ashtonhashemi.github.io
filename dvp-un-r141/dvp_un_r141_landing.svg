<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1460" viewBox="0 0 1200 1460" role="img" aria-labelledby="title">
  <title id="title">EU Homologation Path — UN R141 (TPMS)</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#425d73"/>
    </marker>
  </defs>
  <style>
    .title { font: 700 40px Arial, Helvetica, sans-serif; fill: #17324d; }
    .box { font: 700 24px Arial, Helvetica, sans-serif; fill: #17324d; }
    .box-light { font: 700 24px Arial, Helvetica, sans-serif; fill: #ffffff; }
    .arrow { fill: none; stroke: #425d73; stroke-width: 3; marker-end: url(#arrow); }
    .root { fill: #17324d; stroke: #17324d; stroke-width: 2; }
    .market { fill: #d9edf7; stroke: #4b91b9; stroke-width: 2; }
    .level { fill: #e4f1e5; stroke: #5a9b63; stroke-width: 2; }
    .regulation { fill: #fff2cc; stroke: #d6b656; stroke-width: 2; }
    .dvp { fill: #fce4d6; stroke: #d86a35; stroke-width: 3; }
  </style>

  <rect width="1200" height="1460" fill="#f3f6f8"/>
  <text class="title" x="600" y="105" text-anchor="middle">EU Homologation Path — UN R141 (TPMS)</text>

  <rect class="root" x="300" y="190" width="600" height="105" rx="8"/>
  <text class="box-light" x="600" y="255" text-anchor="middle">Certification</text>
  <path class="arrow" d="M 600 295 L 600 360"/>

  <rect class="market" x="300" y="365" width="600" height="105" rx="8"/>
  <text class="box" x="600" y="430" text-anchor="middle">Europe</text>
  <path class="arrow" d="M 600 470 L 600 535"/>

  <rect class="market" x="300" y="540" width="600" height="105" rx="8"/>
  <text class="box" x="600" y="605" text-anchor="middle">European Union</text>
  <path class="arrow" d="M 600 645 L 600 710"/>

  <rect class="level" x="260" y="715" width="680" height="105" rx="8"/>
  <text class="box" x="600" y="780" text-anchor="middle">Regulation (EU) 2018/858</text>
  <path class="arrow" d="M 600 820 L 600 885"/>

  <rect class="regulation" x="250" y="890" width="700" height="105" rx="8"/>
  <text class="box" x="600" y="955" text-anchor="middle">UN Regulation No. 141 — TPMS</text>
  <path class="arrow" d="M 600 995 L 600 1060"/>

  <rect class="dvp" x="220" y="1065" width="760" height="105" rx="8"/>
  <text class="box" x="600" y="1130" text-anchor="middle">Homologation DVP — UN R141 (TPMS)</text>
</svg>