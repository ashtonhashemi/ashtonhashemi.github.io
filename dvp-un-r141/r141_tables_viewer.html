<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UN-R 141 - 01 Suppl. 2 - Approval of vehicles with regard to their Tyre Pressure Monitoring Systems</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef2f6;
      color: #17324d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow-x: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 12px 18px;
      background: #17324d;
      color: #fff;
      box-shadow: 0 2px 8px rgb(20 42 63 / 22%);
      z-index: 1;
    }

    h1 {
      margin: 0 auto 0 0;
      font-size: 18px;
      min-width: 0;
    }

    main {
      min-width: 0;
      min-height: 0;
      padding: 0;
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 0;
    }

    .toc {
      overflow-y: auto;
      padding: 18px 12px;
      background: #e6edf2;
      border-right: 1px solid #c9d3dc;
    }

    .toc-button {
      display: block;
      width: 100%;
      margin: 0 0 6px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: #17324d;
      padding: 10px 12px;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .toc-button:hover { background: #d5e2eb; }
    .toc-button.is-active {
      border-color: #4b91b9;
      background: #fff;
      font-weight: 700;
    }

    .viewer {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: scroll;
      scrollbar-gutter: stable both-edges;
      scrollbar-width: auto;
      scrollbar-color: #647b8d #dce5ec;
      overscroll-behavior: contain;
      background: #fff;
    }

    .viewer::-webkit-scrollbar {
      width: 16px;
      height: 16px;
    }

    .viewer::-webkit-scrollbar-track {
      background: #dce5ec;
    }

    .viewer::-webkit-scrollbar-thumb {
      min-width: 42px;
      min-height: 42px;
      border: 3px solid #dce5ec;
      border-radius: 0;
      background: #647b8d;
    }

    .viewer::-webkit-scrollbar-thumb:hover {
      background: #425d73;
    }

    .viewer::-webkit-scrollbar-corner {
      background: #dce5ec;
    }

    #viewerContent {
      width: max-content;
      min-width: 100%;
      min-height: calc(100% + 1px);
    }

    #tableImage {
      display: block;
      width: auto;
      height: auto;
      max-width: none;
      border: 0;
    }

    @media (max-width: 850px) {
      header { flex-wrap: wrap; }
      h1 { width: 100%; }
      main { grid-template-columns: 190px minmax(0, 1fr); }
      .toc { padding: 12px 8px; }
      .toc-button { padding: 8px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>UN-R 141 - 01 Suppl. 2 - Approval of vehicles with regard to their Tyre Pressure Monitoring Systems</h1>
  </header>

  <main>
    <nav class="toc" aria-label="Document pages">
      <div id="tableOfContents"></div>
    </nav>
    <div class="viewer" id="viewer">
      <div id="viewerContent">
        <iframe id="tableImage" title="Current table" scrolling="no"></iframe>
      </div>
    </div>
  </main>

  <script>
    const tables = [
      { title: "EU Homologation Path", file: "dvp_un_r141_landing.svg", width: 1200, height: 1460 },
      { title: "Regulatory Traceability", file: "r141_requirements.svg", width: 1608, height: 959 },
      { title: "Test Matrix", file: "r141_test_matrix.svg", width: 3319, height: 3451 },
      { title: "Reference Logical Architecture", file: "tpms_layered_stack.html", width: 1600, height: 970 },
      { title: "Verification Strategy", file: "r141_verification_environment.svg", width: 2342, height: 931 },
      { title: "SIL Stack", file: "sil_stack.html", width: 1600, height: 1050 }
    ];

    const image = document.querySelector("#tableImage");
    const viewer = document.querySelector("#viewer");
    const tableOfContents = document.querySelector("#tableOfContents");
    function sizeTable(table) {
      image.style.width = `${table.width}px`;
      image.style.height = `${table.height}px`;
    }

    image.addEventListener("load", () => {
      const svg = image.contentDocument?.documentElement;
      const width = Number.parseFloat(svg?.getAttribute("width"));
      const height = Number.parseFloat(svg?.getAttribute("height"));
      if (Number.isFinite(width) && Number.isFinite(height)) {
        sizeTable({ width, height });
      }
    });

    let currentIndex = Number.parseInt(location.hash.slice(1), 10);
    if (!Number.isInteger(currentIndex) || currentIndex < 0 || currentIndex >= tables.length) {
      currentIndex = 0;
    }

    function indexFromHash() {
      const index = Number.parseInt(location.hash.slice(1), 10);
      return Number.isInteger(index) && index >= 0 && index < tables.length ? index : 0;
    }

    function showTable(index) {
      currentIndex = (index + tables.length) % tables.length;
      const table = tables[currentIndex];
      sizeTable(table);
      image.src = table.file;
      image.title = table.title;
      for (const button of tableOfContents.children) {
        button.classList.toggle("is-active", Number(button.dataset.index) === currentIndex);
      }
      location.hash = currentIndex;
      viewer.scrollTo({ top: 0, left: 0 });
    }

    window.addEventListener("hashchange", () => {
      const index = indexFromHash();
      if (index !== currentIndex) showTable(index);
    });

    for (const [index, table] of tables.entries()) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "toc-button";
      button.textContent = table.title;
      button.dataset.index = index;
      button.addEventListener("click", () => showTable(index));
      tableOfContents.append(button);
    }

    showTable(currentIndex);
  </script>
</body>
</html>
