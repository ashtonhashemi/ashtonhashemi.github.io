<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Distributed ESC SIL architecture</title>
  <desc id="desc">AWS Graviton HPC runs the FMVSS 126 inspired maneuver and vehicle dynamics model, sending sensor state over UDP IPv4 in a VPC to an x86 EC2 ZCU ESC controller, which returns corrective yaw moment commands. CloudFront, API Gateway, Lambda, Systems Manager, S3 and DynamoDB provide orchestration and results.</desc>
  <defs>
    <style>
      .bg{fill:#f7f7f5}.card{fill:#fff;stroke:#1d1d1f;stroke-width:2}.soft{fill:#f0f1ee;stroke:#8e8e93;stroke-width:1.5}.aws{fill:#fff7e6;stroke:#c87800;stroke-width:2}.line{stroke:#202124;stroke-width:3;fill:none}.dash{stroke:#6b7280;stroke-width:2;stroke-dasharray:9 8;fill:none}.label{font:700 24px Arial,sans-serif;fill:#111}.sub{font:400 18px Arial,sans-serif;fill:#444}.tiny{font:600 16px Arial,sans-serif;fill:#555}.accent{font:700 18px Arial,sans-serif;fill:#9a5700}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#202124"/></marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6b7280"/></marker>
  </defs>
  <rect class="bg" width="1400" height="760" rx="32"/>

  <text x="70" y="65" class="label">Distributed ESC SIL — AWS VPC</text>
  <text x="70" y="96" class="sub">Graviton HPC vehicle simulation ↔ x86 ZCU ESC controller over real UDP/IPv4</text>

  <rect x="70" y="155" width="500" height="350" rx="24" class="aws"/>
  <text x="105" y="205" class="label">AWS Graviton HPC</text>
  <text x="105" y="237" class="sub">c8g ARM64 EC2</text>
  <rect x="110" y="275" width="420" height="72" rx="16" class="card"/>
  <text x="135" y="307" class="tiny">FMVSS 126-inspired Sine-with-Dwell</text>
  <text x="135" y="333" class="sub">0.7 Hz · 500 ms dwell · 80 km/h</text>
  <rect x="110" y="365" width="420" height="105" rx="16" class="card"/>
  <text x="135" y="399" class="tiny">Vehicle dynamics / SIL plant</text>
  <text x="135" y="428" class="sub">steering · yaw rate · lateral acceleration</text>
  <text x="135" y="454" class="sub">sideslip · lateral displacement</text>

  <rect x="830" y="155" width="500" height="350" rx="24" class="aws"/>
  <text x="865" y="205" class="label">x86 ZCU / ESC</text>
  <text x="865" y="237" class="sub">c7i x86_64 EC2</text>
  <rect x="870" y="275" width="420" height="82" rx="16" class="card"/>
  <text x="895" y="309" class="tiny">ESC control application</text>
  <text x="895" y="338" class="sub">desired yaw → corrective yaw moment</text>
  <rect x="870" y="378" width="420" height="92" rx="16" class="card"/>
  <text x="895" y="412" class="tiny">ZCU timing metrics</text>
  <text x="895" y="441" class="sub">processing latency · sequence gaps</text>

  <path d="M570 286 C660 245 740 245 830 286" class="line" marker-end="url(#arrow)"/>
  <text x="617" y="235" class="accent">UDP/IPv4 · 100 Hz · port 5005</text>
  <text x="626" y="267" class="tiny">sensor/control state →</text>

  <path d="M830 386 C740 430 660 430 570 386" class="line" marker-end="url(#arrow)"/>
  <text x="630" y="469" class="tiny">← corrective yaw moment</text>

  <rect x="70" y="565" width="1260" height="125" rx="22" class="soft"/>
  <text x="105" y="604" class="tiny">AWS control plane</text>
  <text x="105" y="639" class="sub">CloudFront dashboard → API Gateway → Lambda → Systems Manager → EC2 nodes</text>
  <text x="105" y="670" class="sub">Run metadata/results → DynamoDB + S3 · dashboard plots FMVSS-style and network timing traces</text>

  <path d="M320 565 L320 510" class="dash" marker-end="url(#arrow2)"/>
  <path d="M1080 565 L1080 510" class="dash" marker-end="url(#arrow2)"/>
</svg>