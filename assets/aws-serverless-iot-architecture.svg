<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Alerta Nova AWS serverless IoT architecture</title>
<desc id="desc">IoT devices publish through AWS IoT Core to Lambda, DynamoDB, and Timestream. Applications authenticate with Cognito and access AppSync and API Gateway. EventBridge and CloudWatch support automation and observability.</desc>
<defs>
 <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#687078"/></marker>
 <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ff9900"/></marker>
 <filter id="s"><feDropShadow dy="4" stdDeviation="5" flood-color="#18202a" flood-opacity=".15"/></filter>
 <style>.cloud{fill:#fff;stroke:#879196;stroke-width:2.5;stroke-dasharray:8 7}.lane{fill:#f7f8f9;stroke:#d5dbdb;stroke-width:2}.node{fill:#fff;stroke:#c8cfd2;stroke-width:1.5}.head{font:700 18px Arial;fill:#161e2d}.label{font:700 15px Arial;fill:#161e2d}.small{font:12px Arial;fill:#5f6b72}.cap{font:700 13px Arial;letter-spacing:1.4px;fill:#5f6b72}.flow{fill:none;stroke:#687078;stroke-width:2.5;marker-end:url(#a)}.hot{fill:none;stroke:#ff9900;stroke-width:3;marker-end:url(#ao)}.dash{fill:none;stroke:#879196;stroke-width:2;stroke-dasharray:6 6;marker-end:url(#a)}.glyph{font:700 25px Arial;fill:#fff}</style>
</defs>
<rect width="1400" height="760" fill="#fff"/><text x="34" y="38" class="head">AWS REFERENCE ARCHITECTURE</text><text x="1366" y="38" text-anchor="end" class="small">Alerta Nova · Serverless IoT</text>

<!-- actors -->
<rect x="34" y="100" width="172" height="218" rx="12" class="lane"/><text x="54" y="130" class="cap">EDGE</text>
<g transform="translate(66 158)" filter="url(#s)"><rect width="108" height="102" rx="10" class="node"/><circle cx="54" cy="42" r="27" fill="#7aa116"/><path d="M39 42h30M54 27v30M35 34l38 16M35 50l38-16" stroke="#fff" stroke-width="2.5"/><text x="54" y="82" text-anchor="middle" class="label">IoT devices</text></g><text x="120" y="286" text-anchor="middle" class="small">MQTT over TLS</text>
<rect x="34" y="438" width="172" height="218" rx="12" class="lane"/><text x="54" y="468" class="cap">EXPERIENCE</text>
<g transform="translate(66 496)" filter="url(#s)"><rect width="108" height="102" rx="10" class="node"/><circle cx="54" cy="42" r="27" fill="#232f3e"/><path d="M38 29h32v23H38zM32 59h44" fill="none" stroke="#fff" stroke-width="3"/><text x="54" y="82" text-anchor="middle" class="label">Applications</text></g><text x="120" y="624" text-anchor="middle" class="small">Web + mobile</text>

<!-- cloud -->
<rect x="250" y="70" width="1116" height="638" rx="18" class="cloud"/><path d="M270 70h190v36H270z" fill="#232f3e"/><text x="290" y="94" class="glyph" style="font-size:15px">AWS CLOUD</text>
<rect x="282" y="122" width="1050" height="242" rx="12" class="lane"/><text x="304" y="150" class="cap">INGESTION &amp; EVENT PROCESSING</text>
<rect x="282" y="396" width="1050" height="258" rx="12" class="lane"/><text x="304" y="424" class="cap">SECURE APPLICATION ACCESS &amp; OPERATIONS</text>

<!-- service card reusable layout -->
<g transform="translate(318 178)" filter="url(#s)"><rect width="156" height="132" rx="10" class="node"/><rect width="156" height="9" rx="9" fill="#7aa116"/><circle cx="78" cy="54" r="27" fill="#7aa116"/><path d="M63 54h30M78 39v30M59 46l38 16M59 62l38-16" stroke="#fff" stroke-width="2.3"/><text x="78" y="98" text-anchor="middle" class="label">AWS IoT Core</text><text x="78" y="117" text-anchor="middle" class="small">Rules + registry</text></g>
<g transform="translate(566 178)" filter="url(#s)"><rect width="156" height="132" rx="10" class="node"/><rect width="156" height="9" rx="9" fill="#ed7100"/><circle cx="78" cy="54" r="27" fill="#ed7100"/><text x="78" y="63" text-anchor="middle" class="glyph">λ</text><text x="78" y="98" text-anchor="middle" class="label">AWS Lambda</text><text x="78" y="117" text-anchor="middle" class="small">Validate + transform</text></g>
<g transform="translate(814 178)" filter="url(#s)"><rect width="156" height="132" rx="10" class="node"/><rect width="156" height="9" rx="9" fill="#c925d1"/><circle cx="78" cy="54" r="27" fill="#c925d1"/><path d="M62 42h32v25H62zM68 48h20M68 55h20M68 62h13" fill="none" stroke="#fff" stroke-width="2.3"/><text x="78" y="98" text-anchor="middle" class="label">EventBridge</text><text x="78" y="117" text-anchor="middle" class="small">Events + schedules</text></g>
<g transform="translate(1062 178)" filter="url(#s)"><rect width="232" height="132" rx="10" class="node"/><rect width="232" height="9" rx="9" fill="#3b48cc"/><circle cx="58" cy="54" r="27" fill="#3b48cc"/><ellipse cx="58" cy="47" rx="14" ry="6" fill="none" stroke="#fff" stroke-width="2.3"/><path d="M44 47v17c0 8 28 8 28 0V47M44 56c0 8 28 8 28 0" fill="none" stroke="#fff" stroke-width="2.3"/><circle cx="174" cy="54" r="27" fill="#3b48cc"/><path d="M159 43h30v23h-30zM165 49h18M165 56h14" fill="none" stroke="#fff" stroke-width="2.3"/><text x="58" y="98" text-anchor="middle" class="label">DynamoDB</text><text x="174" y="98" text-anchor="middle" class="label">Timestream</text><text x="116" y="117" text-anchor="middle" class="small">State + telemetry</text></g>

<g transform="translate(318 466)" filter="url(#s)"><rect width="156" height="132" rx="10" class="node"/><rect width="156" height="9" rx="9" fill="#dd344c"/><circle cx="78" cy="54" r="27" fill="#dd344c"/><circle cx="78" cy="46" r="8" fill="none" stroke="#fff" stroke-width="3"/><path d="M63 69c3-10 27-10 30 0" fill="none" stroke="#fff" stroke-width="3"/><text x="78" y="98" text-anchor="middle" class="label">Amazon Cognito</text><text x="78" y="117" text-anchor="middle" class="small">Identity + access</text></g>
<g transform="translate(566 466)" filter="url(#s)"><rect width="156" height="132" rx="10" class="node"/><rect width="156" height="9" rx="9" fill="#e7157b"/><circle cx="78" cy="54" r="27" fill="#e7157b"/><path d="M63 41l30 26M93 41L63 67M63 41h30v26H63z" fill="none" stroke="#fff" stroke-width="2.3"/><text x="78" y="98" text-anchor="middle" class="label">AWS AppSync</text><text x="78" y="117" text-anchor="middle" class="small">GraphQL + realtime</text></g>
<g transform="translate(814 466)" filter="url(#s)"><rect width="156" height="132" rx="10" class="node"/><rect width="156" height="9" rx="9" fill="#e7157b"/><circle cx="78" cy="54" r="27" fill="#e7157b"/><path d="M59 54h38M69 42L59 54l10 12M87 42l10 12-10 12" fill="none" stroke="#fff" stroke-width="2.5"/><text x="78" y="98" text-anchor="middle" class="label">API Gateway</text><text x="78" y="117" text-anchor="middle" class="small">REST endpoints</text></g>
<g transform="translate(1062 466)" filter="url(#s)"><rect width="232" height="132" rx="10" class="node"/><rect width="232" height="9" rx="9" fill="#759c3e"/><circle cx="116" cy="54" r="27" fill="#759c3e"/><path d="M99 63c1-9 8-12 14-9 3-13 24-10 24 4 9 1 9 14 0 15h-34c-10-1-11-10-4-10z" fill="#fff"/><text x="116" y="98" text-anchor="middle" class="label">Amazon CloudWatch</text><text x="116" y="117" text-anchor="middle" class="small">Logs · metrics · alarms</text></g>

