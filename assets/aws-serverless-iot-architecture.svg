<path d="M174 547H318" class="hot"/><text x="246" y="536" text-anchor="middle" class="small">HTTPS</text><path d="M474 532H566" class="flow"/><path d="M474 556C600 646 730 646 814 556" class="flow"/><path d="M722 532C856 532 924 350 1110 310" class="hot"/><path d="M970 532C1035 532 1060 348 1160 310" class="hot"/>
