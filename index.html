<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ashton Hashemi</title>
  <meta name="description" content="Ashton Hashemi portfolio landing page.">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 220vh;
      background: #f4f4f1;
    }
    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    model-viewer {
      width: min(94vw, 1380px);
      height: min(92vh, 900px);
      background: transparent;
      --poster-color: transparent;
      cursor: grab;
      filter: drop-shadow(0 28px 38px rgba(0,0,0,.08));
    }
    model-viewer:active { cursor: grabbing; }
    @media (max-width: 700px) {
      model-viewer { width: 100vw; height: 82vh; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Interactive 3D vehicle">
    <model-viewer
      id="car"
      src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CarConcept/glTF-Binary/CarConcept.glb"
      alt="Interactive 3D concept vehicle"
      camera-controls
      disable-zoom
      interaction-prompt="none"
      touch-action="pan-y"
      environment-image="neutral"
      exposure="1.05"
      shadow-intensity="0.9"
      shadow-softness="0.9"
      camera-orbit="25deg 72deg 105%"
      field-of-view="28deg">
    </model-viewer>
  </main>

  <script>
    const car = document.getElementById('car');

    function rotateWithScroll() {
      const maxScroll = Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
      const progress = Math.min(Math.max(window.scrollY / maxScroll, 0), 1);
      const azimuth = 25 + progress * 330;
      const radius = 105 - progress * 7;
      car.cameraOrbit = `${azimuth}deg 72deg ${radius}%`;
    }

    window.addEventListener('scroll', rotateWithScroll, { passive: true });
    window.addEventListener('load', rotateWithScroll);
  </script>
</body>
</html>
