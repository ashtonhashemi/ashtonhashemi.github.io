<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ashton Hashemi | Portfolio</title>
  <meta name="description" content="Please use the portfolio link shared with you to view Ashton Hashemi’s work.">
  <link rel="icon" sizes="64x64" href="https://github.com/ashtonhashemi.png?size=64&v=20260826">
  <link rel="canonical" href="https://ashtonhashemi.github.io/">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="top-style.css">
  <style>
    .landing-bar { display: flex; justify-content: space-between; position: static; }
    .landing-copy { max-width: 650px; margin: 0; font-size: 18px; line-height: 1.65; color: #343430; }
    .landing-thanks { margin: 24px 0 0; font-size: 14px; color: #676762; }
    @media (max-width: 800px) { .landing-copy { font-size: 17px; } }
  </style>
</head>
<body>
  <header class="topbar landing-bar" aria-label="Portfolio">
    <span class="site-mark">AH</span>
    <span class="logo">Portfolio</span>
  </header>
  <main>
    <section class="job-hero" aria-labelledby="welcome-heading">
      <div class="job-hero-inner">
        <div class="job-heading">
          <div class="hero-identity">
            <div class="hero-person"><p>Ashton Hashemi</p></div>
            <h1 id="welcome-heading">Please use your<br>shared link.</h1>
          </div>
        </div>
        <div class="job-meta-wrap">
          <div>
            <p class="landing-copy">To view my portfolio, please open the specific link I shared with you in my message or application.</p>
            <p class="landing-thanks">Thank you for your interest in my work.</p>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
