<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ashton Hashemi</title>
  <meta name="description" content="Ashton Hashemi portfolio landing page.">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 100vh;
      overflow: hidden;
      background: #f4f4f1;
    }
    .stage {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      position: relative;
      isolation: isolate;
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(22,22,22,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(22,22,22,.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, #000 0 33%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 0 33%, transparent 75%);
      z-index: -2;
    }
    .car-art {
      width: min(86vw, 1080px);
      height: auto;
      filter: drop-shadow(0 28px 34px rgba(0,0,0,.06));
    }
    .wire { fill: none; stroke: #242424; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
    .wire-soft { fill: none; stroke: #999892; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
    .wire-faint { fill: none; stroke: #c7c6c0; stroke-width: 1; }
    .sensor { fill: #d71920; }
    .sensor-line { fill: none; stroke: #d71920; stroke-width: 1.55; stroke-linecap: round; opacity: .72; }
    .sensor-faint { fill: none; stroke: #d71920; stroke-width: 1; opacity: .22; }
    .scan { transform-origin: 570px 220px; animation: scan 6s linear infinite; }
    .pulse { animation: pulse 2.8s ease-out infinite; transform-origin: center; }
    @keyframes scan { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity:.2; } 50% { opacity:.75; } }
    @media (max-width: 700px) {
      .car-art { width: 98vw; transform: scale(1.05); }
    }
    @media (prefers-reduced-motion: reduce) {
      .scan, .pulse { animation: none; }
    }
  </style>
</head>
