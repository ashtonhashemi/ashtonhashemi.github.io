<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ashton Hashemi | Portfolio</title>
  <meta name="description" content="Please use the portfolio link shared with you to view Ashton Hashemi’s work.">
  <link rel="icon" sizes="64x64" href="https://github.com/ashtonhashemi.png?size=64&v=20260826">
  <link rel="canonical" href="https://ashtonhashemi.github.io/">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 28px; background: #f5f4f0; color: #222b32; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 880px; padding: clamp(24px, 5vw, 48px); background: #fff; border: 1px solid #e5e4df; border-radius: 20px; box-shadow: 0 16px 60px #22334408; }
    .name { margin: 0 0 20px; font-size: 13px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: #58666d; }
    h1 { margin: 0 0 20px; font-size: clamp(30px, 5vw, 44px); line-height: 1.15; letter-spacing: -.035em; font-weight: 600; }
    .message { margin: 0; max-width: 46ch; color: #58666d; font-size: 18px; line-height: 1.7; }
    .art { display: block; width: 100%; height: auto; margin: 0 0 32px; border-radius: 10px; }
    .thanks { margin: 30px 0 0; color: #58666d; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <p class="name">Ashton Hashemi · Portfolio</p>
    <img class="art" src="assets/vehicle-diagnostics-art.png" width="1536" height="1024" fetchpriority="high" alt="Graphite cutaway illustration of an electric vehicle, revealing its battery, electronic modules, and diagnostic connections.">
    <h1>Please use your shared link.</h1>
    <p class="message">To view my portfolio, please open the specific link I shared with you in my message or application.</p>
    <p class="thanks">Thank you for your interest in my work.</p>
  </main>
</body>
</html>
