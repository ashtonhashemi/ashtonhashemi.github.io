<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ashton Hashemi — Systems Engineer</title>
  <meta name="description" content="Ashton Hashemi portfolio landing page.">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#fff}
    body{min-height:240vh;overflow-x:hidden}
    .stage{position:fixed;inset:0;background:#fff;overflow:hidden}
    canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
    canvas:active{cursor:grabbing}
    .hint{position:absolute;right:clamp(18px,4vw,54px);bottom:clamp(18px,4vw,42px);margin:0;color:#171717;font:600 11px/1.2 Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
    .hint::before{content:"";display:inline-block;width:30px;height:1px;margin:0 10px 3px 0;background:#171717}
    .error{position:absolute;inset:0;display:grid;place-items:center;color:#222;font:14px Arial,sans-serif;opacity:0;pointer-events:none}.error.visible{opacity:1}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(prefers-reduced-motion:reduce){body{min-height:100vh}}
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
  </script>
</head>
<body>
  <main class="stage" aria-label="Interactive 3D wireframe head">
    <span class="sr-only">Drag to rotate the three-dimensional wireframe head. Scroll the page to rotate it through a full turn.</span>
    <p class="hint" aria-hidden="true">Drag or scroll to rotate</p>
    <p id="load-error" class="error" role="status">The 3D model could not be loaded.</p>
  </main>
  <script type="module">
    import * as THREE from 'three';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

    const stage=document.querySelector('.stage');
    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0xffffff);

    const camera=new THREE.PerspectiveCamera(28,innerWidth/innerHeight,.01,100);
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setSize(innerWidth,innerHeight);
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    stage.prepend(renderer.domElement);

    const controls=new OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true;
    controls.enablePan=false;
    controls.enableZoom=true;
    controls.minDistance=2;
    controls.maxDistance=8;

    const root=new THREE.Group();
    scene.add(root);
    let baseRotation=0;

    new GLTFLoader().load('assets/wireframe-head.glb',gltf=>{
      const model=gltf.scene;
      model.traverse(node=>{
        if(node.isMesh){
          node.material=new THREE.MeshBasicMaterial({color:0x151515,wireframe:true});
          node.material.side=THREE.DoubleSide;
        }
      });

      const box=new THREE.Box3().setFromObject(model);
      const center=box.getCenter(new THREE.Vector3());
      const size=box.getSize(new THREE.Vector3());
      model.position.sub(center);
      root.add(model);

      const largest=Math.max(size.x,size.y,size.z);
      const distance=largest/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)))*1.12;
      camera.position.set(0,0,distance);
      controls.target.set(0,0,0);
      controls.minDistance=distance*.72;
      controls.maxDistance=distance*1.65;
      controls.update();
    },undefined,()=>document.getElementById('load-error').classList.add('visible'));

    const reduced=matchMedia('(prefers-reduced-motion: reduce)');
    function updateScrollRotation(){
      if(reduced.matches)return;
      const max=Math.max(document.documentElement.scrollHeight-innerHeight,1);
      baseRotation=(scrollY/max)*Math.PI*2;
    }
    addEventListener('scroll',updateScrollRotation,{passive:true});
    addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });

    renderer.setAnimationLoop(()=>{
      root.rotation.y=baseRotation;
      controls.update();
      renderer.render(scene,camera);
    });
    updateScrollRotation();
  </script>
</body>
</html>
