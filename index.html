<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ashton Hashemi</title>
  <meta name="description" content="Ashton Hashemi portfolio landing page.">
  <script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 220vh;
      background: #f5f5f2;
      overflow-x: hidden;
    }
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 54%, rgba(255,255,255,.98) 0 28%, rgba(250,250,247,.96) 55%, #f2f2ef 100%);
    }
    .stage::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 11%;
      height: 14%;
      background: radial-gradient(ellipse at center, rgba(0,0,0,.12), rgba(0,0,0,0) 68%);
      filter: blur(28px);
      opacity: .42;
      pointer-events: none;
    }
    #api-frame {
      position: absolute;
      inset: -3%;
      width: 106%;
      height: 106%;
      border: 0;
      background: transparent;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 700px) {
      #api-frame { inset: -8%; width: 116%; height: 116%; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Interactive modern electric sedan">
    <span class="sr-only">Drag the vehicle to rotate it. Scroll the page to orbit around it.</span>
    <iframe
      id="api-frame"
      title="Interactive 3D modern electric sedan"
      allow="autoplay; fullscreen; xr-spatial-tracking"
      allowfullscreen
      mozallowfullscreen="true"
      webkitallowfullscreen="true"></iframe>
  </main>

  <script>
    const iframe = document.getElementById('api-frame');
    const client = new Sketchfab('1.12.1', iframe);
    const uid = '54860f7335c04bb8b7b181d15a13fe50';

    let api = null;
    let target = [0, 0, 0];
    let radiusXY = 1;
    let height = 0;
    let startAngle = 0;
    let rafPending = false;

    function applyScrollOrbit() {
      rafPending = false;
      if (!api) return;

      const maxScroll = Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
      const progress = Math.min(Math.max(window.scrollY / maxScroll, 0), 1);
      const angle = startAngle + progress * Math.PI * 2;
      const eye = [
        target[0] + Math.cos(angle) * radiusXY,
        target[1] + Math.sin(angle) * radiusXY,
        target[2] + height
      ];

      api.setCameraLookAt(eye, target, 0);
    }

    function scheduleScrollOrbit() {
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(applyScrollOrbit);
    }

    client.init(uid, {
      autostart: 1,
      camera: 0,
      autospin: 0,
      scrollwheel: 0,
      transparent: 1,
      ui_controls: 0,
      ui_infos: 0,
      ui_hint: 0,
      ui_stop: 0,
      ui_help: 0,
      ui_settings: 0,
      ui_inspector: 0,
      ui_vr: 0,
      ui_annotations: 0,
      ui_animations: 0,
      ui_watermark: 0,
      success: function(viewerApi) {
        api = viewerApi;
        api.start();
        api.addEventListener('viewerready', function() {
          api.getCameraLookAt(function(err, camera) {
            if (err || !camera) return;
            target = camera.target.slice();
            const dx = camera.position[0] - target[0];
            const dy = camera.position[1] - target[1];
            height = camera.position[2] - target[2];
            radiusXY = Math.max(Math.hypot(dx, dy), 0.01);
            startAngle = Math.atan2(dy, dx);
            applyScrollOrbit();
          });
        });
      },
      error: function() {
        console.error('Unable to load 3D vehicle viewer.');
      }
    });

    window.addEventListener('scroll', scheduleScrollOrbit, { passive: true });
  </script>
</body>
</html>
