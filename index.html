<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ashton Hashemi</title>
  <meta name="description" content="Ashton Hashemi portfolio landing page.">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      overflow: hidden;
      background: #f4f4f1;
      font-family: Arial, Helvetica, sans-serif;
    }
    .landing {
      position: relative;
      display: grid;
      place-items: center;
      width: 100vw;
      height: 100vh;
      color: inherit;
      text-decoration: none;
      isolation: isolate;
    }
    .landing::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(circle at center, #000 0 30%, transparent 72%);
      -webkit-mask-image: radial-gradient(circle at center, #000 0 30%, transparent 72%);
      z-index: -2;
    }
    .network {
      position: relative;
      width: min(72vw, 760px);
      aspect-ratio: 1.55 / 1;
      filter: drop-shadow(0 14px 30px rgba(0,0,0,.05));
    }
    .line {
      position: absolute;
      height: 1px;
      background: #aaa9a4;
      transform-origin: left center;
      z-index: -1;
    }
    .line.l1 { left: 50%; top: 50%; width: 33%; transform: rotate(-25deg); }
    .line.l2 { left: 50%; top: 50%; width: 35%; transform: rotate(27deg); }
    .line.l3 { left: 50%; top: 50%; width: 31%; transform: rotate(153deg); }
    .line.l4 { left: 50%; top: 50%; width: 33%; transform: rotate(205deg); }
    .line.l5 { left: 50%; top: 50%; width: 29%; transform: rotate(-88deg); }
    .line.l6 { left: 50%; top: 50%; width: 30%; transform: rotate(89deg); }
    .node {
      position: absolute;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid #9a9993;
      background: #f4f4f1;
      box-shadow: 0 0 0 8px rgba(244,244,241,.8);
    }
    .node::after {
      content: "";
      position: absolute;
      inset: 11px;
      border-radius: 50%;
      background: #d71920;
    }
    .node.n1 { right: 8%; top: 17%; }
    .node.n2 { right: 4%; bottom: 17%; }
    .node.n3 { left: 6%; top: 19%; }
    .node.n4 { left: 4%; bottom: 14%; }
    .node.n5 { left: 48%; top: 3%; }
    .node.n6 { left: 49%; bottom: 2%; }
    .hub {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 154px;
      height: 154px;
      transform: translate(-50%, -50%);
      border-radius: 32px;
      background: #111;
      box-shadow: 0 22px 48px rgba(0,0,0,.16);
    }
    .hub::before,
    .hub::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 999px;
      background: #f4f4f1;
    }
    .hub::before { top: 54px; width: 50px; height: 8px; }
    .hub::after { top: 75px; width: 28px; height: 8px; }
    .pulse {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 190px;
      height: 190px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(215,25,32,.38);
      border-radius: 50%;
      animation: pulse 3s ease-out infinite;
    }
    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(.72); opacity: 0; }
      25% { opacity: .7; }
      100% { transform: translate(-50%, -50%) scale(1.45); opacity: 0; }
    }
    .landing:focus-visible { outline: 3px solid #d71920; outline-offset: -8px; }
    @media (max-width: 700px) {
      .network { width: 92vw; }
      .hub { width: 122px; height: 122px; border-radius: 26px; }
      .hub::before { top: 42px; width: 42px; }
      .hub::after { top: 63px; width: 24px; }
      .pulse { width: 154px; height: 154px; }
      .node { width: 28px; height: 28px; }
      .node::after { inset: 9px; }
    }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: .35; } }
  </style>
</head>
<body>
  <a class="landing" href="system-engineer-fault-management/" aria-label="Open System Engineer - Fault Management portfolio">
    <div class="network" aria-hidden="true">
      <div class="line l1"></div><div class="line l2"></div><div class="line l3"></div>
      <div class="line l4"></div><div class="line l5"></div><div class="line l6"></div>
      <div class="pulse"></div>
      <div class="hub"></div>
      <div class="node n1"></div><div class="node n2"></div><div class="node n3"></div>
      <div class="node n4"></div><div class="node n5"></div><div class="node n6"></div>
    </div>
  </a>
</body>
</html>
