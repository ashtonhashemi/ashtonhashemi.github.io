<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ashton Hashemi — 3D Portrait</title>
  <meta name="description" content="Interactive 3D portrait of Ashton Hashemi.">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%}
    body{min-height:260vh;overflow-x:hidden;color:#151515;background:#eeeae3;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .stage{position:fixed;inset:0;isolation:isolate;overflow:hidden;background:radial-gradient(circle at 50% 43%,rgba(255,255,255,.98) 0 18%,rgba(246,243,237,.96) 47%,#ddd7ce 100%)}
    .stage::before{content:"ASHTON";position:absolute;z-index:-1;left:50%;top:49%;translate:-50% -50%;color:rgba(29,28,26,.045);font-size:clamp(7rem,22vw,22rem);font-weight:800;letter-spacing:-.08em;line-height:.8;white-space:nowrap;pointer-events:none}
    .stage::after{content:"";position:absolute;z-index:-1;left:25%;right:25%;bottom:6%;height:12%;border-radius:50%;background:rgba(20,18,15,.19);filter:blur(32px);transform:scaleY(.36);pointer-events:none}
    .identity{position:absolute;z-index:2;top:clamp(1.25rem,4vw,3rem);left:clamp(1.25rem,5vw,4.5rem);pointer-events:none}.identity p{margin:0}
    .eyebrow{color:#746f67;font-size:.7rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:.35rem 0 0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.9rem,4vw,4rem);font-weight:400;letter-spacing:-.045em;line-height:.95}
    .hint{position:absolute;z-index:2;right:clamp(1.25rem,5vw,4.5rem);bottom:clamp(1.25rem,4vw,3rem);display:flex;align-items:center;gap:.65rem;color:#57534d;font-size:.72rem;font-weight:650;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
    .hint::before{content:"";width:2.2rem;height:1px;background:currentColor}
    model-viewer{width:100%;height:100%;--poster-color:transparent;background:transparent;cursor:grab}model-viewer:active{cursor:grabbing}model-viewer::part(default-progress-bar){display:none}
    .error{position:absolute;left:50%;top:50%;translate:-50% -50%;padding:.8rem 1rem;border:1px solid rgba(0,0,0,.16);border-radius:999px;background:rgba(255,255,255,.72);font-size:.78rem;opacity:0;transition:opacity .2s ease;pointer-events:none}.error.visible{opacity:1}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:700px){body{min-height:220vh}.identity{top:1.25rem;left:1.25rem}.hint{right:1.25rem;bottom:1.25rem}.stage::after{left:8%;right:8%}}
    @media(prefers-reduced-motion:reduce){body{min-height:100vh}}
  </style>
</head>
<body>
  <main class="stage" aria-label="Interactive 3D portrait of Ashton Hashemi">
    <header class="identity"><p class="eyebrow">Interactive portrait</p><h1>Ashton<br>Hashemi</h1></header>
    <model-viewer id="portrait" src="assets/ashton-head.glb" alt="Approximate interactive 3D portrait of Ashton Hashemi" camera-controls disable-pan interaction-prompt="none" shadow-intensity=".72" shadow-softness=".86" exposure="1.08" environment-image="neutral" camera-orbit="0deg 84deg 4.6m" min-camera-orbit="auto 67deg 3.5m" max-camera-orbit="auto 104deg 6.5m" field-of-view="28deg">
      <span class="sr-only">Drag to rotate the portrait. Scroll the page to orbit around it.</span>
    </model-viewer>
    <p class="hint" aria-hidden="true">Drag or scroll to rotate</p>
    <p id="load-error" class="error" role="status">The 3D portrait could not be loaded.</p>
  </main>
  <script>
    const portrait=document.getElementById('portrait'),loadError=document.getElementById('load-error'),reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
    let rafPending=false;
    function applyScrollOrbit(){rafPending=false;if(reducedMotion.matches)return;const maxScroll=Math.max(document.documentElement.scrollHeight-window.innerHeight,1);const progress=Math.min(Math.max(window.scrollY/maxScroll,0),1);portrait.cameraOrbit=`${progress*360}deg 84deg 4.6m`}
    function scheduleScrollOrbit(){if(rafPending)return;rafPending=true;requestAnimationFrame(applyScrollOrbit)}
    portrait.addEventListener('error',()=>loadError.classList.add('visible'));
    window.addEventListener('scroll',scheduleScrollOrbit,{passive:true});applyScrollOrbit();
  </script>
</body>
</html>
